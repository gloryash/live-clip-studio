[project]
name = "live-clip-studio"
version = "0.1.0"
description = "Local live-video transcript and keyframe workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
  "claude-real-video",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jieba>=0.42,<1",
  "jsonschema>=4.23,<5",
  "opencc-python-reimplemented>=0.1.7,<1",
  "pillow>=11,<13",
  "opencv-python-headless>=4.10,<5",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
framing = [
  "torch>=2.2,<3",
  "python-speech-features==0.6",
]
diarization = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<2",
  "soundfile>=0.12,<1",
  "speechbrain>=1.0,<2",
  "torch>=2.2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.uv.sources]
claude-real-video = { path = "../claude-real-video", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live_clip_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
